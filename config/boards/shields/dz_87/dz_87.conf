# Monochrome GPIO indicator LEDs
CONFIG_LED=y

# Custom monochrome LED indicator module (BLE/USB channel cues +
# CapsLock/ScrollLock HID indicators + deep-sleep LED parking)
CONFIG_CZMAO_DZ_87_INDICATORS=y

# 3 BLE profiles (host slots). Channels advertise as czm_dz_87_ble_1/2/3
# (renamed by the indicator module on profile switch, DZ17-style).
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_MAX_CONN=3
CONFIG_BT_DEVICE_NAME="czm_dz_87_ble_1"

# USB enumeration
CONFIG_USB_DEVICE_PRODUCT="czm_dz_87"
# CZM own VID 0x4A17; PID allocation is incremental per keyboard
# (DS17R3/QMK=0x4A18, DS22R6=0x4A40, ... DZ17/ZMK uses ZMK default,
#  DZ 87 is the next assigned PID = 0x4A42).
CONFIG_USB_DEVICE_VID=0x4A17
CONFIG_USB_DEVICE_PID=0x4A42

# HID indicators (CapsLock / ScrollLock state from host)
CONFIG_ZMK_HID_INDICATORS=y

# USB + BLE output
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Bootloader soft-entry via deprecated GPREGRET (works on nice_nano_v2)
CONFIG_NRF_STORE_REBOOT_TYPE_GPREGRET=y

# Power management
# 5 min (300000ms) idle: BT stays connected
CONFIG_ZMK_IDLE_TIMEOUT=300000
# Deep sleep (System OFF) after ZMK default timeout; indicator module parks
# the active-low LEDs before sleep so they never stay lit in SYSTEM OFF.
CONFIG_ZMK_SLEEP=y

# ZMK Studio support
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y

# Logging
CONFIG_ZMK_LOG_LEVEL_INF=y
