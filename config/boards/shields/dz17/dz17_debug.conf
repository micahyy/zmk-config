# DZ17 BLE diagnostic overlay — used ONLY by the dz17_debug CI build via
# EXTRA_CONF_FILE (paired with the "zmk-usb-logging" snippet in build.yml).
# Not auto-loaded by the normal dz17 build (filename does not match the "dz17"
# shield name), so it has zero effect on production firmware.
#
# Purpose: with zmk-usb-logging routing ZMK logs over USB CDC, this raises the
# Bluetooth stack and ZMK log levels to debug so that when the keyboard next
# boots into the "BLE won't connect" state while plugged in, the BLE startup /
# bond-load / advertising sequence is captured.
#
# Studio is disabled because it and USB logging both claim the USB CDC endpoint.
# The USB-disconnects-BLE feature is disabled so the keyboard keeps BLE up over
# cable for diagnosis.
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
CONFIG_ZMK_BLE_DISCONNECT_ON_USB_READY=n
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_BT_LOG_LEVEL_DBG=y
