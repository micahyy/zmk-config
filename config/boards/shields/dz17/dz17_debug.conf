# DZ17 BLE diagnostic overlay — used ONLY by the dz17_debug CI build via
# EXTRA_CONF_FILE. Not auto-loaded by the normal dz17 build (filename does not
# match the "dz17" shield name), so it has zero effect on production firmware.
#
# Purpose: route logs over USB CDC (115200 not needed, it's USB) at debug
# level, with the Bluetooth stack and ZMK at max verbosity, so that when the
# keyboard next boots into the "BLE won't connect" state while plugged in, the
# BLE startup / bond-load / advertising sequence is captured.
#
# Studio is disabled because it and USB logging both claim the USB CDC
# endpoint. The USB-disconnects-BLE feature is disabled so the keyboard keeps
# BLE up over cable for diagnosis.
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_BT_LOG_LEVEL_DBG=y
CONFIG_LOG_DEFAULT_LEVEL_DBG=y
CONFIG_ZMK_BLE_DISCONNECT_ON_USB_READY=n
