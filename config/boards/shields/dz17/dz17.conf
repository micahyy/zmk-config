# WS2812 RGB underglow: 17 per-key LEDs on P0.26 via SPIM3
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y

# Default effect: swirl (3)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=80
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=5

# 3 BLE profiles (host slots)
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_MAX_CONN=3
# Default BLE advertised name (profile switch will set czmao_dz17_1/2/3)
CONFIG_BT_DEVICE_NAME="czmao_dz17_1"

# HID indicators (NumLock/CapsLock state from host)
CONFIG_ZMK_HID_INDICATORS=y

# Bootloader soft-entry via deprecated GPREGRET (works on nice_nano_v2)
CONFIG_NRF_STORE_REBOOT_TYPE_GPREGRET=y

# Power management
# 5 min (300000ms) idle: BT stays connected, RGB off
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# NOTE: Deep sleep (CONFIG_ZMK_SLEEP) is DISABLED because SPIM3 WS2812 driver
# does not properly resume after deep sleep on nRF52840, causing RGB freeze.
# Light sleep still saves significant power with BT connected.

# ZMK Studio support
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y

# Logging
CONFIG_ZMK_LOG_LEVEL_INF=y
