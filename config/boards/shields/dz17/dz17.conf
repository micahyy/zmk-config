# WS2812 RGB underglow: 17 per-key LEDs on P0.26 via SPIM3
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y

# Default effect: swirl (3)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=80
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=5

# 3 BLE profiles (host slots)
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_MAX_CONN=3
# Default BLE advertised name (profile switch will set czmao_dz17_1/2/3)
CONFIG_BT_DEVICE_NAME="czmao_dz17_1"

# HID indicators (NumLock/CapsLock state from host)
CONFIG_ZMK_HID_INDICATORS=y

# Bootloader soft-entry support (needed for &bootloader key to work)
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# Power management
# 5 min (300000ms) idle: BT stays connected, RGB/peripherals off
CONFIG_ZMK_IDLE_TIMEOUT=300000
# Turn off RGB automatically when idle (required for sleep to work)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# 30 min (1800000ms) deep sleep: BT disconnects, RAM retained, press key to wake
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Disable Zephyr device power management to prevent SPIM3 WS2812 freeze after
# sleep/wake. The nRF SPIM driver does not properly resume MOSI after suspend,
# leaving the WS2812 strip unresponsive. Without PM_DEVICE, devices stay fully
# powered through idle (power draw difference is negligible for this simple
# numpad).
CONFIG_PM_DEVICE=n

# ZMK Studio support
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y

# Logging
CONFIG_ZMK_LOG_LEVEL_INF=y
