# DZ17 monochrome GPIO LED indicators (WS2812 strip removed)
CONFIG_LED=y

# 3 BLE profiles (host slots)
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_MAX_CONN=3
# Default BLE advertised name (profile switch sets czm_ble_1/2/3)
CONFIG_BT_DEVICE_NAME="czm_ble_1"

# HID indicators (NumLock state from host)
CONFIG_ZMK_HID_INDICATORS=y

# USB + BLE output (for &out OUT_TOG key)
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Bootloader soft-entry via deprecated GPREGRET (works on nice_nano_v2)
CONFIG_NRF_STORE_REBOOT_TYPE_GPREGRET=y

# Power management: 5 min (300000ms) idle light sleep, BT stays connected.
CONFIG_ZMK_IDLE_TIMEOUT=300000
# Deep sleep was disabled only because of the WS2812 SPIM3 resume bug;
# the strip is now removed, so deep sleep can be re-enabled later if wanted.
# CONFIG_ZMK_SLEEP=y

# ZMK Studio support (key remap; RGB controls removed with the strip)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y

# Logging
CONFIG_ZMK_LOG_LEVEL_INF=y
