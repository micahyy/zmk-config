# Monochrome GPIO indicator LEDs (WS2812 strip removed)
# DIAG: stock indicator module disabled, diag_force_off.c owns the LEDs
# CONFIG_CZMAO_DZ17_INDICATORS is not set
CONFIG_LED=y

# 3 BLE profiles (host slots)
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_MAX_CONN=3
# Default BLE advertised name (profile switch sets czm_dz17_ble_1/2/3)
CONFIG_BT_DEVICE_NAME="czm_dz17_ble_1"

# USB enumeration product string shown on the host
CONFIG_USB_DEVICE_PRODUCT="czm_dz17"

# HID indicators (NumLock/CapsLock state from host)
CONFIG_ZMK_HID_INDICATORS=y

# DIAG: USB stack disabled to force is_usb_power_present()=false
# CONFIG_ZMK_USB is not set
CONFIG_ZMK_BLE=y

# Bootloader soft-entry via deprecated GPREGRET (works on nice_nano_v2)
CONFIG_NRF_STORE_REBOOT_TYPE_GPREGRET=y

# Battery monitoring: BAT feeds VDDH through an SS14 Schottky diode, so VDDH
# reads ~200mV low at keyboard currents; compensate before SoC conversion.
CONFIG_ZMK_BATTERY_NRF_VDDH_DIODE_DROP_MV=200

# Power management
# DIAG build: 15s idle / 25s deep sleep for quick sleep-path testing
CONFIG_ZMK_IDLE_TIMEOUT=15000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=25000
# Deep sleep now safe: no SPIM3/WS2812 driver in this build.
CONFIG_ZMK_SLEEP=y

# DIAG: ZMK Studio disabled (depends on USB stack)
# CONFIG_ZMK_STUDIO is not set

# Logging
CONFIG_ZMK_LOG_LEVEL_INF=y
