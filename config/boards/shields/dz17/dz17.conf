# Monochrome GPIO indicator LEDs (WS2812 strip removed)
CONFIG_LED=y

# 3 BLE profiles (host slots)
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_MAX_CONN=3
# Default BLE advertised name (profile switch sets czm_dz17_ble_1/2/3)
CONFIG_BT_DEVICE_NAME="czm_dz17_ble_1"

# USB enumeration product string shown on the host
CONFIG_USB_DEVICE_PRODUCT="czm_dz17"

# HID indicators (NumLock/CapsLock state from host)
CONFIG_ZMK_HID_INDICATORS=y

# USB + BLE output (for &out OUT_TOG key)
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Bootloader soft-entry via deprecated GPREGRET (works on nice_nano_v2)
CONFIG_NRF_STORE_REBOOT_TYPE_GPREGRET=y

# Power management
# 5 min (300000ms) idle: BT stays connected
CONFIG_ZMK_IDLE_TIMEOUT=300000
# Deep sleep now safe: no SPIM3/WS2812 driver in this build.
CONFIG_ZMK_SLEEP=y

# ZMK Studio support
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y

# Logging
CONFIG_ZMK_LOG_LEVEL_INF=y
