# Runtime config copied verbatim from dz_87 (same PCB, same LEDs, same radio).
# Keep the two files in sync.

# Monochrome GPIO indicator LEDs
CONFIG_LED=y

# Custom monochrome LED indicator module (BLE/USB channel cues +
# CapsLock/ScrollLock HID indicators + deep-sleep LED parking)
CONFIG_CZMAO_DZ_87_INDICATORS=y

# 3 BLE profiles (host slots). Channels advertise as czm_dz_87_ble_1/2/3
# (renamed by the indicator module on profile switch, DZ17-style).
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_MAX_CONN=3
CONFIG_BT_DEVICE_NAME="czm_dz_87_ble_1"

# USB enumeration
CONFIG_USB_DEVICE_PRODUCT="czm_dz_87"
# CZM own VID 0x4A17; PID allocation is incremental per keyboard
# (DS17R3/QMK=0x4A18, DS22R6=0x4A40, ... DZ17/ZMK uses ZMK default,
#  DZ 87 is the next assigned PID = 0x4A42).
CONFIG_USB_DEVICE_VID=0x4A17
CONFIG_USB_DEVICE_PID=0x4A42

# HID indicators (CapsLock / ScrollLock state from host).
# Required: the custom indicator module above calls into
# app/src/hid_indicators.c, which is only built when this is set — otherwise
# linking fails with
#   undefined reference to `zmk_hid_indicators_get_current_profile'
CONFIG_ZMK_HID_INDICATORS=y

# USB + BLE output
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Bootloader soft-entry via deprecated GPREGRET (works on nice_nano_v2)
CONFIG_NRF_STORE_REBOOT_TYPE_GPREGRET=y

# Power management
# 5 min (300000ms) idle (light sleep): BT stays connected, no key loss.
CONFIG_ZMK_IDLE_TIMEOUT=300000
# Deep sleep disabled: avoids BLE disconnect/reconnect and first-key loss.
CONFIG_ZMK_SLEEP=n

# ZMK Studio support (freeze fixed in ZMK fork 5a9ee40: on a shared single
# matrix, switching physical layout no longer touches the kscan at all -- no
# PM suspend and no disable/enable_callback -- so the matrix keeps scanning).
# LOCKING=n: Studio can edit without pressing an unlock key first.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Battery monitoring: same hardware as DZ17 — BAT feeds VDDH through an SS14
# Schottky diode, so VDDH reads ~200mV low at keyboard currents; compensate
# before SoC conversion.
CONFIG_ZMK_BATTERY_NRF_VDDH_DIODE_DROP_MV=200

# Output: when USB HID is up, drop BLE and stay silent over Bluetooth so the
# host isn't connected over both transports; BLE auto-resumes on unplug.
CONFIG_ZMK_BLE_DISCONNECT_ON_USB_READY=y

# Logging
CONFIG_ZMK_LOG_LEVEL_INF=y
