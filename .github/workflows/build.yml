name: Build ZMK Firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update

      - name: West Zephyr Export
        run: west zephyr-export

      - name: Build DZ17
        run: >
          west build -s zmk/app -b nice_nano_v2 -d build_dz17
          -- -DSHIELD=dz17
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
          -DSNIPPET="studio-rpc-usb-uart"
          -DCONFIG_ZMK_STUDIO=y

      - name: Rename DZ17 firmware
        run: cp build_dz17/zephyr/zmk.uf2 dz17_nice_nano_v2.uf2

      - name: Build DZ17 BLE diagnostic
        run: >
          west build -s zmk/app -b nice_nano_v2 -d build_dz17_dbg
          -- -DSHIELD=dz17
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
          -DSNIPPET="zmk-usb-logging"
          -DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/boards/shields/dz17/dz17_debug.conf"

      - name: Rename DZ17 diagnostic firmware
        run: cp build_dz17_dbg/zephyr/zmk.uf2 dz17_debug_nice_nano_v2.uf2

      - name: Build settings reset
        run: >
          west build -s zmk/app -b nice_nano_v2 -d build_reset
          -- -DSHIELD=settings_reset
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Rename settings reset firmware
        run: cp build_reset/zephyr/zmk.uf2 settings_reset_nice_nano_v2.uf2

      - name: Build DZ 87 (ANSI 6.25u)
        run: >
          west build -s zmk/app -b nice_nano_v2 -d build_dz87_625
          -- -DSHIELD=dz_87
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
          -DSNIPPET="studio-rpc-usb-uart"
          -DCONFIG_ZMK_STUDIO=y
          -DDTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/config/boards/shields/dz_87/dz_87_625.overlay"

      - name: Rename DZ 87 6.25u firmware
        run: cp build_dz87_625/zephyr/zmk.uf2 dz_87_625_nice_nano_v2.uf2

      - name: Build DZ 87 (ANSI 7u)
        run: >
          west build -s zmk/app -b nice_nano_v2 -d build_dz87_7u
          -- -DSHIELD=dz_87
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
          -DSNIPPET="studio-rpc-usb-uart"
          -DCONFIG_ZMK_STUDIO=y
          -DDTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/config/boards/shields/dz_87/dz_87_7u.overlay"

      - name: Rename DZ 87 7u firmware
        run: cp build_dz87_7u/zephyr/zmk.uf2 dz_87_7u_nice_nano_v2.uf2

      - name: Build DZ 87 (ALL 94)
        run: >
          west build -s zmk/app -b nice_nano_v2 -d build_dz87_all
          -- -DSHIELD=dz_87
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
          -DSNIPPET="studio-rpc-usb-uart"
          -DCONFIG_ZMK_STUDIO=y
          -DDTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/config/boards/shields/dz_87/dz_87_all.overlay"

      - name: Rename DZ 87 ALL firmware
        run: cp build_dz87_all/zephyr/zmk.uf2 dz_87_all_nice_nano_v2.uf2

      - name: Upload DZ17 firmware
        uses: actions/upload-artifact@v4
        with:
          name: dz17_firmware
          path: dz17_nice_nano_v2.uf2

      - name: Upload DZ17 BLE diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: dz17_debug_firmware
          path: dz17_debug_nice_nano_v2.uf2

      - name: Upload settings reset
        uses: actions/upload-artifact@v4
        with:
          name: settings_reset_firmware
          path: settings_reset_nice_nano_v2.uf2

      - name: Upload DZ 87 6.25u firmware
        uses: actions/upload-artifact@v4
        with:
          name: dz_87_625_firmware
          path: dz_87_625_nice_nano_v2.uf2

      - name: Upload DZ 87 7u firmware
        uses: actions/upload-artifact@v4
        with:
          name: dz_87_7u_firmware
          path: dz_87_7u_nice_nano_v2.uf2

      - name: Upload DZ 87 ALL firmware
        uses: actions/upload-artifact@v4
        with:
          name: dz_87_all_firmware
          path: dz_87_all_nice_nano_v2.uf2
