name: Build ZMK Firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update

      - name: West Zephyr Export
        run: west zephyr-export

      - name: Build DZ17
        run: >
          west build -s zmk/app -b nice_nano_v2
          -- -DSHIELD=dz17
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
          -DSNIPPET="studio-rpc-usb-uart"
          -DCONFIG_ZMK_STUDIO=y

      - name: Debug kscan ord
        if: always()
        run: |
          echo "=== DT_CHOSEN_zmk_kscan lines ==="
          grep -rn "DT_CHOSEN_zmk_kscan" build/zephyr/include/generated/ || echo "NOT FOUND"
          echo "=== DT_N_S_kscan_ORD exact ==="
          grep -rn "define DT_N_S_kscan_ORD " build/zephyr/include/generated/ || echo "NOT FOUND"
          echo "=== kscan node comment block in devicetree_generated.h ==="
          grep -n "Node identifier: DT_N_S_kscan$" build/zephyr/include/generated/devicetree_generated.h || grep -n "DT_N_S_kscan" build/zephyr/include/generated/devicetree_generated.h | head -20

      - name: Rename firmware
        if: success()
        run: cp build/zephyr/zmk.uf2 dz17_nice_nano_v2.uf2

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dz17_firmware
          path: dz17_nice_nano_v2.uf2
