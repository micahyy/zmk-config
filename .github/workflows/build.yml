name: Build ZMK Firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update

      - name: West Zephyr Export
        run: west zephyr-export

      - name: Build DZ17
        run: >
          west build -s zmk/app -b nice_nano_v2
          -- -DSHIELD=dz17
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
          -DSNIPPET="studio-rpc-usb-uart"
          -DCONFIG_ZMK_STUDIO=y

      - name: Debug kscan device
        if: always()
        run: |
          D=build/zephyr
          G=$D/include/generated/devicetree_generated.h
          echo "===== zephyr.dts: kscan node body ====="
          grep -n -A25 "kscan0: kscan {" $D/zephyr.dts || echo "(label form not found, try bare)"
          grep -n -A25 "^	kscan {" $D/zephyr.dts || true
          echo ""
          echo "===== kscan DEP_ORD ====="
          KORD=$(grep -oP '#define DT_N_S_kscan_DEP_ORD \K[0-9]+' $G | head -1)
          echo "KORD=$KORD"
          echo "===== chosen zmk_kscan ORD macro ====="
          grep -n "DT_CHOSEN_zmk_kscan" $G | head -5
          echo "===== device extern lines for kscan ORD ====="
          grep -n "dts_ord_${KORD}" $G | head -20
          echo "===== how many __device_dts_ord externs total ====="
          grep -c "__device_dts_ord" $G
          echo "===== kscan-gpio-direct source compiled? ====="
          find build -name "*.o" -path "*kscan*" 2>/dev/null | head
          grep -rn "kscan_gpio_direct" build/zephyr/CMakeFiles 2>/dev/null | head -3 || echo "(not in CMakeFiles)"

      - name: Rename firmware
        if: success()
        run: cp build/zephyr/zmk.uf2 dz17_nice_nano_v2.uf2

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dz17_firmware
          path: dz17_nice_nano_v2.uf2
