name: Build ZMK Firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update

      - name: West Zephyr Export
        run: west zephyr-export

      - name: Build DZ17
        run: >
          west build -s zmk/app -b nice_nano_v2 -d build_dz17
          -- -DSHIELD=dz17
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
          -DSNIPPET="studio-rpc-usb-uart"
          -DCONFIG_ZMK_STUDIO=y

      - name: Rename DZ17 firmware
        run: cp build_dz17/zephyr/zmk.uf2 dz17_nice_nano_v2.uf2

      - name: Build DZ 87
        run: >
          west build -s zmk/app -b nice_nano_v2 -d build_dz87
          -- -DSHIELD=dz_87
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
          -DSNIPPET="studio-rpc-usb-uart"
          -DCONFIG_ZMK_STUDIO=y

      - name: Rename DZ 87 firmware
        run: cp build_dz87/zephyr/zmk.uf2 dz_87_nice_nano_v2.uf2

      - name: Diagnose battery config
        if: always()
        run: |
          echo "=== DZ87 .config battery symbols ==="
          grep -iE "DIODE_DROP|BATTERY_NRF_VDDH|ZMK_BATTERY=|BATTERY_REPORTING" build_dz87/zephyr/.config || echo "NONE in DZ87 .config"
          echo "=== DZ87 merged devicetree battery nodes ==="
          grep -iE "vbatt|battery-nrf-vddh|battery-voltage-divider|zmk,battery" build_dz87/zephyr/zephyr.dts || echo "no battery node in DZ87 merged dts"
          echo "=== DZ17 .config battery (reference) ==="
          grep -iE "DIODE_DROP|BATTERY_NRF_VDDH" build_dz17/zephyr/.config || echo "NONE in DZ17 .config"

      - name: Upload DZ17 firmware
        uses: actions/upload-artifact@v4
        with:
          name: dz17_firmware
          path: dz17_nice_nano_v2.uf2

      - name: Upload DZ 87 firmware
        uses: actions/upload-artifact@v4
        with:
          name: dz_87_firmware
          path: dz_87_nice_nano_v2.uf2
